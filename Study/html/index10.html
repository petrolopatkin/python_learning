<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <title>CSS Mini Project</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <header>
            <h1>Our Staff</h1>
            <nav>
                <a href="#profile1">Paprika</a>
                <a href="#profile2">Nebula</a>
                <a href="#profile3">Jinx</a>
            </nav>
        </header>
        <main>
            <article id="profile1" class="card">
                <figure>
                    <img src="/Study/img/cat1.jpg" alt="Paprika Web Developer" width="500" height="500">
                    <figcaption>Paprika <span class="nowrap">Web Developer</span></figcaption>
                </figure>
                <p><q>I develop web pages</q></p>
            </article>
            <article id="profile2" class="card">
                <figure>
                    <img src="/Study/img/cat2.jpg" alt="Nebula Teacher" width="500" height="500">
                    <figcaption>Nebula Teacher</figcaption>
                </figure>
                <p><q>I teach other cats</q></p>
            </article>
            <article id="profile3" class="card">
                <figure>
                    <img src="/Study/img/cat3.jpg" alt="Jinx Designer" width="500" height="500">
                    <figcaption>Jinx Designer</figcaption>
                </figure>
                <p><q>I design stuff</q></p>
            </article>
        </main>
        <footer>
            <p>&copy; CuteCats Co.</p>
        </footer>
    </body>
</html>
